apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: kafka
spec:
  selector:
    matchLabels:
      app: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - image: mysql:5.7          # 5.6 -> 5.7 (5.6은 EOL, 이미지 안정성/호환성↑)
          name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "Dankook1!"
            - name: MYSQL_DATABASE
              value: "test"         # 컨테이너 기동 시 test DB 자동 생성
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            # initdb.sql -> 최초 기동 시 1회 실행되는 SQL
            - name: mysql-initdb
              mountPath: /docker-entrypoint-initdb.d
            # my.cnf -> binlog_format=ROW, server_id 등 로그 설정
            - name: mysql-conf
              mountPath: /etc/mysql/conf.d
      volumes:
        - name: mysql-initdb
          configMap:
            name: mysql-config
            items:
              - key: initdb.sql
                path: initdb.sql
        - name: mysql-conf
          configMap:
            name: mysql-config
            items:
              - key: my.cnf
                path: my.cnf
